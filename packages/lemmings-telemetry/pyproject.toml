[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lemmings-telemetry"
version = "6.5.0"
description = "Optional offline reports over Lemmings dispatch run logs"
requires-python = ">=3.10"

[project.scripts]
lemmings-telemetry = "lemmings_telemetry.report:main"

[tool.setuptools]
packages = ["lemmings_telemetry"]
