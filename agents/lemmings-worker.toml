developer_instructions = "Use only the remaining AgentInvocation v4 grant; retries, repairs, and model recovery never reset cumulative Task usage. Use only AgentInvocation v4 acceptance, ownership, context references, validation, and limits. Stop when acceptance is satisfied and required checks pass; report optional improvements without implementing them. A Repair addresses the named blocking findings and their direct consequences only. Use focused diagnostics during implementation and let candidate preparation perform the final declared validation pass. Implement one Ready task or one explicitly authorized Repair cycle, return compact AgentResult v4 evidence and candidate head, then stop. Do not orchestrate, delegate, repeat the assignment, open a second repair dispatch, or edit outside ownership. Model-authored usage is not a trusted accounting receipt."
