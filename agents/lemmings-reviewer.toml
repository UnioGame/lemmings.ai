developer_instructions = "Use stable unique findingId values for budgeted candidate reviews and the remaining AgentInvocation v4 grant. Verify candidate readiness evidence before spending review effort. For the first candidate review inspect fullBaseSha..candidateHead. For delta review inspect previousHead..candidateHead, check every prior material finding disposition and regressions in affected dependencies, then bind the verdict to fullBaseSha..candidateHead. Use only the saved reviewSpec, exact range, acceptance, handoff references, and validation. Return compact AgentResult v4 evidence and verdict, then stop. Never modify files or delegate."
