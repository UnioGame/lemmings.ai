[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lemmings"
version = "7.0.0"
description = "Deterministic helpers for the Lemmings skill"
requires-python = ">=3.10"

[project.scripts]
lemmings = "lemmings.cli:main"

[tool.setuptools]
package-dir = {lemmings = "skills/lemmings/scripts/lemmings"}
packages = ["lemmings"]
